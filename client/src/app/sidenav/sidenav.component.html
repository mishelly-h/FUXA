@if (showSidenav) {
<div class="sidenav-menu" style="height: 100%" [ngClass]="'sidenav-menu-' + layout.navigation.type"
                        [style.background-color]="layoutNavigation.bkcolor" [style.color]="layoutNavigation.fgcolor">
    <mat-list style="background-color: inherit;">
        <mat-list-item class="sidenav-header" style="display: flex; justify-content: center; height: 45px; font-weight: bold; padding-bottom: 10px; width: unset"
                       [style.color]="layoutNavigation.fgcolor">
            @if (!logo) {
<span class="sidenav-title" [style.color]="layoutNavigation.fgcolor">{{'sidenav.title' | translate}}</span>
} @else {
<img src="{{logo}}" style="max-width: 100%; max-height: 100%;">
}
            
        </mat-list-item>
        @for (item of layout.navigation.items; track item; let i = $index) {

            <mat-list-item [ngClass]="'menu-item-' + layout.navigation.type" style="width: unset" [style.color]="layoutNavigation.fgcolor">
                <button type="button" mat-button class="sidenav-btn sidenav-submenu-btn" (click)="isExpandable(item) ? toggleSubMenu(item) : onGoTo(item)"
                        [style.color]="layoutNavigation.fgcolor"
                       >
@switch ($any(layout.navigation.type)) {
@case ('icon') {
<div class="menu-item-content-icon">
                        @if (item.image) {
<img src="{{item.image}}">
}
                        @if (item.icon) {
<mat-icon [style.color]="layoutNavigation.fgcolor">{{item.icon}}</mat-icon>
}
                    </div>
}
@case ('text') {
<div class="menu-item-content-text">
                        <span [style.color]="layoutNavigation.fgcolor">{{item.text}}</span>
                    </div>
}
@case ('block') {
<div class="menu-item-content-block">
                        @if (item.image) {
<img src="{{item.image}}">
}
                        @if (item.icon) {
<mat-icon [style.color]="layoutNavigation.fgcolor">{{item.icon}}</mat-icon>
}
                        <span [style.color]="layoutNavigation.fgcolor">{{item.text}}</span>
                    </div>
}
@case ('inline') {
<div class="menu-item-content-inline">
                        @if (item.image) {
<img src="{{item.image}}">
}
                        @if (item.icon) {
<mat-icon [style.color]="layoutNavigation.fgcolor">{{item.icon}}</mat-icon>
}
                        <span style="display: inline-block" [style.color]="layoutNavigation.fgcolor">{{item.text}}</span>
                    </div>
}
@if (isExpandable(item)) {
<mat-icon class="sidenav-submenu-icon">
                        {{ isExpanded(item) ? 'expand_less' : 'expand_more' }}
                    </mat-icon>
}
}
</button>
            </mat-list-item>
            <!-- Submenu -->
            @if (isExpandable(item) && isExpanded(item)) {
<mat-list class="submenu-list">
                @for (child of item.children; track child) {
<mat-list-item [ngClass]="'menu-item-' + layout.navigation.type"
                               class="sidenav-submenu-item"
                               [style.color]="layoutNavigation.fgcolor">
                <button type="button" mat-button class="sidenav-btn" (click)="onGoTo(child)"
                            [style.color]="layoutNavigation.fgcolor"
                           >
@switch ($any(layout.navigation.type)) {
@case ('icon') {
<div class="menu-item-content-icon">
                            @if (child.image) {
<img src="{{child.image}}">
}
                            @if (child.icon) {
<mat-icon [style.color]="layoutNavigation.fgcolor">{{child.icon}}</mat-icon>
}
                        </div>
}
@case ('text') {
<div class="menu-item-content-text">
                            <span [style.color]="layoutNavigation.fgcolor">{{child.text}}</span>
                        </div>
}
@case ('block') {
<div class="menu-item-content-block">
                            @if (child.image) {
<img src="{{child.image}}">
}
                            @if (child.icon) {
<mat-icon [style.color]="layoutNavigation.fgcolor">{{child.icon}}</mat-icon>
}
                            <span [style.color]="layoutNavigation.fgcolor">{{child.text}}</span>
                        </div>
}
@case ('inline') {
<div class="menu-item-content-inline">
                            @if (child.image) {
<img src="{{child.image}}">
}
                            @if (child.icon) {
<mat-icon [style.color]="layoutNavigation.fgcolor">{{child.icon}}</mat-icon>
}
                            <span style="display: inline-block" [style.color]="layoutNavigation.fgcolor">{{child.text}}</span>
                        </div>
}
}
</button>
                </mat-list-item>
}
            </mat-list>
}
        
}
    </mat-list>
</div>
}
