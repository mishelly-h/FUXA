<div class="my-form-field device-input">
    <span>{{ 'gauges.property-tag-label' | translate }} {{ getDeviceName() }}</span>
    <button mat-icon-button (click)="onBindTag()" class="tag-link">
        <mat-icon>link</mat-icon>
    </button>
    <input matInput
           class="device-variable-input"
           title="{{ tagTitle | translate }}"
           placeholder="{{ tagTitle | translate}}"
           type="text"
           [formControl]="tagFilter"
           [matAutocomplete]="autoDevices"
           [readonly]="readonly"
           (input)="onChanged()">
    <mat-autocomplete #autoDevices="matAutocomplete" [displayWith]="displayFn" (optionSelected)="onDeviceTagSelected($event.option.value)">
        @for (device of devicesTags$ | async; track device) {
<mat-optgroup class="device-group-label" [label]="device.name">
            @for (tag of device.tags; track tag) {
<mat-option [value]="tag" class="device-option-label">
                <span>{{tag.name}}</span>
            </mat-option>
}
        </mat-optgroup>
}
    </mat-autocomplete>
</div>
