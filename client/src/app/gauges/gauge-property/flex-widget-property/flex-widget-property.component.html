<div class="container">
    @for (varRef of property().varsToBind; track varRef) {
<div class="var-ref">
        <div class="my-form-field">
            <input type="text"
                   [value]="varRef.originalName"
                   [readonly]="true">
        </div>
        <span> - </span>
        <div class="inbk">
            <flex-variable [data]="dataDevices"
                    [value]="varRef"
                    [withStaticValue]="true"
                    [withStaticType]="varRef.type"
                    [withBitmask]="false" />
        </div>
    </div>
}
</div>
